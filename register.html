<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contain">
        <h2>Register</h2>
        <form>
            <div class="form_grp">
                <label>Name</label>
                <input type="text">
            </div>

            <div class="form_grp">
                <label>Email</label>
                <input type="email">
            </div>

            <div class="form_grp">
                <label>Password</label>
                <input type="password">
            </div>

            <div class="form_grp">
                <label>Confirm Password</label>
                <input type="password">
            </div>

            <input type="button" id="btn" value="Register" onclick="window.location.href='register-success.html'">

            <p>Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>
</body>
</html>
